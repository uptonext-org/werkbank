[project]
name = "werkbank-api"
version = "0.1.0"
description = "FastAPI backend for UpToWork."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.33",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6.0,<7",
  "httpx>=0.28,<0.29",
  "ruff>=0.8,<0.9",
  "mypy>=1.13,<2",
  "pyright>=1.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# Pyright is the project's selected type checker (used in CI); mypy above
# remains available for local use. Minimal config: just point it at the
# source and test trees and match ruff's target Python version.
[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
