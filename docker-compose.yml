# Local development environment.
#
# Usage:
#   docker compose up -d db        # just PostgreSQL, run apps/api locally
#   docker compose up --build      # PostgreSQL + the API container

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-werkbank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-werkbank}
      POSTGRES_DB: ${POSTGRES_DB:-werkbank}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-werkbank}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-werkbank}:${POSTGRES_PASSWORD:-werkbank}@db:5432/${POSTGRES_DB:-werkbank}
    ports:
      - '${API_PORT:-8000}:8000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
