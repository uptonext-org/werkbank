# nginx config for the apps/web production image (infra/docker/web.Dockerfile).
#
# Runs on port 8080 (the nginx-unprivileged base image's non-root default,
# see web.Dockerfile) rather than the usual 80.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy same-origin API calls to the api service. This is what
    # VITE_API_URL defaults to (see .env.example) — it lets the built app
    # call a relative "/api/..." path with no CORS setup and no rebuild
    # required to retarget the API elsewhere (only a compose/deploy
    # config change). The trailing "/api/" on proxy_pass preserves the
    # request path as-is (apps/api serves its versioned routes under
    # /api/v1, see apps/api/app/main.py).
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback so client-side routing (if/when added) handles unknown
    # paths instead of nginx 404ing on a hard refresh.
    location / {
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
